[project]
name = "offline-agent"
version = "0.1.0"
description = "A multimodal assistant that sees, hears and talks back. Runs entirely on your laptop."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "requests>=2.31",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "sounddevice>=0.4.6",
    "faster-whisper>=1.0",
    "huggingface_hub>=0.23",
    "jupyterlab>=4.0",
    "ipywidgets>=8.0",
    "mujoco>=3.2",
]

[dependency-groups]
dev = ["nbclient>=0.10", "nbformat>=5.9", "pyflakes>=3.0"]

[tool.uv]
package = false
